<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footyless — daily football teasers</title>
  <meta name="description" content="Quick daily football knowledge puzzles in EN/FR/ES/AR. No account, no ads overload, five-minute brain teasers." />
  <meta name="theme-color" content="#161819" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=dm-sans@400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
</head>
<body data-page="home">
  <div class="app">
    <main class="home-main">
      <div class="container">
        <p class="tagline anim-rise" data-i18n="tagline">Five-minute football teasers. Fresh set, every midnight&nbsp;UTC.</p>
        <div class="game-grid stagger" id="game-grid"><!-- cards injected --></div>

        <div style="display:flex; justify-content:center;">
          <div class="daily-strip anim-rise" style="animation-delay:.35s">
            <span class="pulse-dot"></span>
            <span>New puzzles in <strong id="daily-countdown">--:--:--</strong></span>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <a href="#" data-soon data-i18n="privacy">Privacy</a><span class="footer-sep">•</span>
        <a href="#" data-soon data-i18n="terms">Terms</a><span class="footer-sep">•</span>
        <a href="#" data-soon data-i18n="changelog">Changelog</a><span class="footer-sep">•</span>
        <a href="#" data-soon data-i18n="contact">Contact</a><span class="footer-sep">•</span>
        <span data-i18n="footer_plain">Not affiliated with any league, obviously</span>
      </div>
    </footer>
  </div>

  <script src="js/vendor/howler.min.js"></script>
  <script src="js/core.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/home.js" defer></script>
</body>
</html>
